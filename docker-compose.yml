services:
  db:
    image: pgvector/pgvector:pg16
    container_name: govsaarthi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: govsaarthi_user
      POSTGRES_PASSWORD: govsaarthi_password
      POSTGRES_DB: govsaarthi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govsaarthi_user -d govsaarthi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
